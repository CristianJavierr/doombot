services:
  cinema-monitor:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - monitor-data:/app/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD", "python", "monitor.py", "--healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

volumes:
  monitor-data:
