name: Monitor de boletas

on:
  schedule:
    # Evita el minuto 0, donde suele concentrarse la carga de GitHub.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: Enviar también un WhatsApp de prueba
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cinema-monitor
  cancel-in-progress: false

jobs:
  monitor:
    # Solo la rama predeterminada recibe secretos y modifica el historial compartido.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      DATA_DIR: data
      CHECK_INTERVAL_SECONDS: '300'
      CONFIRMATIONS: '1'
      PAGE_TIMEOUT_SECONDS: '60'
      NOTIFY_RETRY_SECONDS: '300'
      NOTIFIER: callmebot
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas del monitor y persistencia
        run: python -m unittest -q
      - name: Recuperar navegador de caché
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('requirements.txt') }}
      - name: Preparar Chromium
        run: python -m playwright install --with-deps chromium --only-shell
      - name: Recuperar historial persistente
        id: restore
        run: python github_state.py restore
      - name: Probar WhatsApp si se solicitó
        id: whatsapp_test
        if: inputs.test_notification == true
        continue-on-error: true
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        run: python monitor.py --test-notification
      - name: Revisar cartelera y enviar aviso si corresponde
        id: check
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        run: python monitor.py --once
      - name: Guardar historial aunque falle la lectura o el envío
        if: always() && steps.restore.outcome == 'success'
        run: python github_state.py save
      - name: Resumen
        if: always()
        run: python github_state.py summary
      - name: Señalar fallo de la prueba de WhatsApp
        if: always() && steps.whatsapp_test.outcome == 'failure'
        run: |
          echo '::error::CallMeBot no aceptó la prueba. Revisa la activación y el secreto CALLMEBOT_API_KEY.'
          exit 1
